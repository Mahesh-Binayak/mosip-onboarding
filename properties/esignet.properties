# Properties for MODULE=esignet (onboard_esignet_partner in default.sh)
# Edit this file and rerun the onboarder Job to change any of these values -
# e.g. after a "policy group/policy/partner already exists" or similar PMS error,
# pick a new PARTNER_KC_USERNAME/POLICY_NAME/POLICY_GROUP_NAME here and rerun.

APPLICATION_ID=partner
MODULE_CLIENTID=mosip-pms-client
POLICY_NAME=mpolicy-default-esignet
POLICY_GROUP_NAME=mpolicygroup-default-esignet
PARTNER_KC_USERNAME=mpartner-default-esignet
PARTNER_ORGANIZATION_NAME=IITB
PARTNER_TYPE=Misp_Partner
PARTNER_DOMAIN=MISP

# Keycloak user created (and later deleted) to act as the partner manager for this run.
PARTNER_MANAGER_USERNAME=esignet-kc-mockusername
PARTNER_MANAGER_PASSWORD=esignet-kc-mockpassword

# Auth-policy document (policies/allowedAuthTypes/etc) applied to the created policy.
POLICY_DATA_FILE=./default-esignet-misp-policy.json

# Set to "false" to skip writing this run's onboarding result into the live cluster
# (creating/patching the secret the real service reads, and restarting it where
# applicable) - useful for a one-off/local/test onboard that shouldn't touch anything
# already running. The client ID/keys are still available in config-secrets.json and
# the html report either way. Leave blank/unset to keep the default (true).
SYNC_LIVE_DEPLOYMENT=

# Real k8s secret the SYNC_LIVE_DEPLOYMENT step writes the MISP license key into - must
# match what esignet's deploy/esignet/install.sh creates and mounts as MOSIP_ESIGNET_MISP_KEY.
# Leave blank to keep the historical defaults (esignet-misp-onboarder-key / mosip-esignet-misp-key).
ESIGNET_MISP_KEY_SECRET_NAME=
ESIGNET_MISP_KEY_SECRET_KEY=
